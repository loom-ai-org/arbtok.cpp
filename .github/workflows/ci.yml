name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # x86-64-v3 has FMA: the cell fails if a multiply-add is fused.
        march: [baseline, x86-64-v3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Fetch the stem lexicon into the Hugging Face cache
        # The lexicon, diacritize and fusion goldens read this revision; the tests run offline.
        run: |
          rev=05a7734e5ff20a567820f7134e1414a4b2daaa87
          d="$HOME/.cache/huggingface/hub/datasets--TigreGotico--arabic-stem-lexicon"
          mkdir -p "$d/refs" "$d/snapshots/$rev"
          curl -sSfL -o "$d/snapshots/$rev/ar-stems.tsv" \
            "https://huggingface.co/datasets/TigreGotico/arabic-stem-lexicon/resolve/$rev/ar-stems.tsv"
          printf %s "$rev" > "$d/refs/main"
          echo "2f6a66dbbbee86f2db873497463d6e93eb0fddc431b7fd002244d99699fb79ee  $d/snapshots/$rev/ar-stems.tsv" | sha256sum -c
      - uses: astral-sh/setup-uv@v6
      - name: Show the CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|fma|f16c|avx512[a-z_0-9]*|avx_vnni[a-z_0-9]*|amx[a-z_0-9]*)$' | tr '\n' ' '
          echo
      - name: Dump the model goldens on this runner
        # The model goldens hold the onnxruntime output of one CPU class, so the
        # runner dumps them again with the Python reference. The gcc baseline
        # cell also dumps the other goldens, which must be byte-identical to the
        # committed files.
        run: tools/dump_model_goldens.sh "$RUNNER_TEMP/goldens" ${{ (matrix.compiler == 'gcc' && matrix.march == 'baseline') && '--check' || '' }}
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++; else export CXX=g++; fi
          if [ "${{ matrix.march }}" != baseline ]; then flags="-march=${{ matrix.march }}"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DARBTOK_GOLDENS_DIR="$RUNNER_TEMP/goldens" -DCMAKE_CXX_FLAGS="${flags:-}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Install and build a consumer
        run: |
          # First an install into another prefix than the configured one, used
          # by a program outside that prefix with no data variable set: the
          # configured prefix holds no data yet.
          cmake --install build --prefix "$RUNNER_TEMP/moved"
          cmake -S tests/package_consumer -B moved-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/moved"
          cmake --build moved-consumer
          ./moved-consumer/consumer
          cmake --install build
          cmake -S tests/package_consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer
          ./consumer/consumer

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the surface table of PARITY.md
        # inventory.py reads the package with ast, so the wheel is unpacked, not installed.
        run: |
          url=$(python3 -c 'import json, urllib.request; d = json.load(urllib.request.urlopen("https://pypi.org/pypi/arbtok/0.0.2a74/json")); print(next(u["url"] for u in d["urls"] if u["packagetype"] == "bdist_wheel"))')
          curl -sSfL -o "$RUNNER_TEMP/arbtok.whl" "$url"
          python3 -m zipfile -e "$RUNNER_TEMP/arbtok.whl" "$RUNNER_TEMP/wheel"
          python3 tools/inventory.py --package-dir "$RUNNER_TEMP/wheel/arbtok" --parity PARITY.md
          git diff --exit-code PARITY.md

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Fetch the stem lexicon into the Hugging Face cache
        # The lexicon, diacritize and fusion goldens read this revision; the tests run offline.
        run: |
          rev=05a7734e5ff20a567820f7134e1414a4b2daaa87
          d="$HOME/.cache/huggingface/hub/datasets--TigreGotico--arabic-stem-lexicon"
          mkdir -p "$d/refs" "$d/snapshots/$rev"
          curl -sSfL -o "$d/snapshots/$rev/ar-stems.tsv" \
            "https://huggingface.co/datasets/TigreGotico/arabic-stem-lexicon/resolve/$rev/ar-stems.tsv"
          printf %s "$rev" > "$d/refs/main"
          echo "2f6a66dbbbee86f2db873497463d6e93eb0fddc431b7fd002244d99699fb79ee  $d/snapshots/$rev/ar-stems.tsv" | sha256sum -c
      - uses: astral-sh/setup-uv@v6
      - name: Show the CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|fma|f16c|avx512[a-z_0-9]*|avx_vnni[a-z_0-9]*|amx[a-z_0-9]*)$' | tr '\n' ' '
          echo
      - name: Dump the model goldens on this runner
        run: tools/dump_model_goldens.sh "$RUNNER_TEMP/goldens"
      - name: Build with ASan and UBSan
        run: |
          CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DARBTOK_PARITY_STRIDE=20 \
            -DARBTOK_GOLDENS_DIR="$RUNNER_TEMP/goldens" \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800 -j 4

name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # x86-64-v3 has FMA: the cell fails if a multiply-add is fused.
        march: [baseline, x86-64-v3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++; else export CXX=g++; fi
          if [ "${{ matrix.march }}" != baseline ]; then flags="-march=${{ matrix.march }}"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_CXX_FLAGS="${flags:-}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4
      - name: Install and build a consumer
        run: |
          cmake --install build
          cmake -S tests/package_consumer -B consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer
          ./consumer/consumer

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the surface table of PARITY.md
        # inventory.py reads the package with ast, so the wheel is unpacked, not installed.
        run: |
          url=$(python3 -c 'import json, urllib.request; d = json.load(urllib.request.urlopen("https://pypi.org/pypi/arbtok/0.0.2a71/json")); print(next(u["url"] for u in d["urls"] if u["packagetype"] == "bdist_wheel"))')
          curl -sSfL -o "$RUNNER_TEMP/arbtok.whl" "$url"
          python3 -m zipfile -e "$RUNNER_TEMP/arbtok.whl" "$RUNNER_TEMP/wheel"
          python3 tools/inventory.py --package-dir "$RUNNER_TEMP/wheel/arbtok" --parity PARITY.md
          git diff --exit-code PARITY.md

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libboost-dev libicu-dev
      - name: Build with ASan and UBSan
        run: |
          CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DARBTOK_PARITY_STRIDE=20 \
            -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -D_GLIBCXX_ASSERTIONS"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 1800 -j 4
